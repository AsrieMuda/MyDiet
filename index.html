<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tempahan Makanan HKL</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hijau:#0F5B4E; --hijau-tekan:#0B463C; --on-hijau:#FFFFFF;
  --sage:#E4EEE9; --kertas:#F7FAF8; --kad:#FFFFFF; --dakwat:#17231F; --kelabu:#5B6C66; --garis:#D5E1DB;
  --kupon:#F2C14E; --kupon-bg:#FFF6DC; --kupon-ink:#5A4300;
  --merah:#B3261E; --merah-bg:#FBE9E7; --biru:#1F5FA8; --biru-bg:#E7F0FA;
  --bayang:0 1px 2px rgba(15,91,78,.08), 0 8px 24px rgba(15,91,78,.08);
  --font:"Plus Jakarta Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --hijau:#5CC3AE; --hijau-tekan:#8ED8C8; --on-hijau:#06231D;
    --sage:#1A2925; --kertas:#0E1613; --kad:#15201C; --dakwat:#E4EEEA; --kelabu:#9CB0A8; --garis:#283934;
    --kupon:#E8B93F; --kupon-bg:#2E2610; --kupon-ink:#F5D98A;
    --merah:#F2887F; --merah-bg:#3A1D1A; --biru:#8DB8EC; --biru-bg:#16263A;
    --bayang:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --hijau:#5CC3AE; --hijau-tekan:#8ED8C8; --on-hijau:#06231D;
  --sage:#1A2925; --kertas:#0E1613; --kad:#15201C; --dakwat:#E4EEEA; --kelabu:#9CB0A8; --garis:#283934;
  --kupon:#E8B93F; --kupon-bg:#2E2610; --kupon-ink:#F5D98A;
  --merah:#F2887F; --merah-bg:#3A1D1A; --biru:#8DB8EC; --biru-bg:#16263A;
  --bayang:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--kertas); color:var(--dakwat); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
h1,h2,h3,p{ margin:0; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--kupon); outline-offset:2px; border-radius:6px; }
.tersembunyi{ display:none !important; }

/* Header */
.atas{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--hijau); color:var(--on-hijau); }
.atas-dalam{ max-width:680px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; }
.jenama{ font-weight:800; letter-spacing:-.01em; line-height:1.15; white-space:nowrap; }
@media (max-width:420px){ .jenama small{ display:none; } }
.jenama small{ display:block; font-weight:500; opacity:.8; font-size:.8rem; }
.pengguna{ margin-left:auto; text-align:right; font-size:.8rem; line-height:1.25; min-width:0; }
.pengguna b{ display:block; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pengguna span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85; }
.btn-keluar{ background:transparent; border:1px solid currentColor; color:inherit; border-radius:999px; padding:6px 12px; font-size:.8rem; font-weight:600; opacity:.9; white-space:nowrap; flex:none; }
.demo-jalur{ background:var(--kupon); color:#3B2C00; font-size:.8rem; font-weight:600; text-align:center; padding:4px 12px; }

main{ max-width:680px; margin:0 auto; padding:20px 16px 150px; }
.kepala h1{ font-size:1.75rem; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
.kepala p{ color:var(--kelabu); font-size:.92rem; margin-bottom:2px; }
.kepala{ margin-bottom:16px; }
.kecil{ font-size:.85rem; color:var(--kelabu); }
h2.bahagian{ font-size:1.05rem; font-weight:700; margin:28px 0 10px; }

/* Segmen sesi */
.segmen{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:0 -16px 16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.segmen::-webkit-scrollbar{ display:none; }
.segmen button{ flex:none; border:1.5px solid var(--garis); background:var(--kad); border-radius:999px; padding:8px 14px; font-weight:600; font-size:.9rem; white-space:nowrap; }
.segmen button[aria-selected="true"]{ background:var(--dakwat); color:var(--kertas); border-color:var(--dakwat); }
.segmen .bil{ font-weight:500; opacity:.65; margin-left:4px; }

/* Senarai */
.senarai{ list-style:none; margin:0; padding:0; background:var(--kad); border:1px solid var(--garis); border-radius:14px; overflow:hidden; }
.senarai > li{ padding:14px 16px; border-top:1px solid var(--garis); display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }
.senarai > li:first-child{ border-top:0; }
.nama{ font-weight:700; line-height:1.3; }
.meta{ font-size:.84rem; color:var(--kelabu); display:flex; flex-wrap:wrap; gap:0 10px; }
.harga{ font-weight:700; text-align:right; white-space:nowrap; }
.tindakan{ grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }

.item{ grid-template-columns:1fr auto !important; }
.item .kanan{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.stepper{ display:inline-flex; align-items:center; border:1.5px solid var(--hijau); border-radius:999px; overflow:hidden; }
.stepper button{ width:34px; height:32px; border:0; background:transparent; color:var(--hijau); font-size:1.15rem; font-weight:700; line-height:1; }
.stepper span{ min-width:22px; text-align:center; font-weight:700; }
.btn-tambah{ border:1.5px solid var(--hijau); color:var(--hijau); background:transparent; border-radius:999px; padding:5px 14px; font-weight:700; font-size:.88rem; }

/* Butang */
.btn{ border:0; border-radius:12px; padding:12px 18px; font-weight:700; background:var(--hijau); color:var(--on-hijau); }
.btn:active{ background:var(--hijau-tekan); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn-penuh{ width:100%; }
.btn-garis{ background:transparent; color:var(--hijau); border:1.5px solid var(--hijau); }
.btn-kecil{ padding:7px 12px; font-size:.85rem; border-radius:10px; }
.btn-bahaya{ background:transparent; color:var(--merah); border:1.5px solid var(--merah); }

/* Chip status */
.chip{ display:inline-block; font-size:.76rem; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--sage); color:var(--dakwat); white-space:nowrap; }
.chip.Draf,.chip.Baru{ background:var(--biru-bg); color:var(--biru); }
.chip.Disahkan,.chip.Siap,.chip.Dihantar{ background:var(--sage); color:var(--hijau); }
.chip.Ditolak,.chip.Dibatalkan{ background:var(--merah-bg); color:var(--merah); }
.chip.Disediakan{ background:var(--kupon-bg); color:var(--kupon-ink); }
.chip.Menunggu{ background:var(--biru-bg); color:var(--biru); }
.chip.Aktif{ background:var(--sage); color:var(--hijau); }
.chip.Tamat{ background:var(--kupon-bg); color:var(--kupon-ink); }
.chip.Digantung{ background:var(--merah-bg); color:var(--merah); }
.chip.Catuan,.chip.Belum{ background:var(--kupon-bg); color:var(--kupon-ink); }

/* Kupon catuan */
.kupon{ position:relative; display:flex; align-items:center; gap:14px; background:var(--kupon-bg); border:2px dashed var(--kupon); border-radius:14px; padding:12px 16px; margin-bottom:16px; color:var(--kupon-ink); }
.kupon .cop{ flex:none; width:52px; height:52px; border-radius:50%; border:2.5px solid var(--kupon); display:grid; place-items:center; font-weight:800; font-size:.66rem; line-height:1.1; text-align:center; transform:rotate(-12deg); }
.kupon b{ display:block; }
.kupon.guna{ opacity:.6; }

.kosong{ background:var(--kad); border:1px dashed var(--garis); border-radius:14px; padding:28px 20px; text-align:center; color:var(--kelabu); }
.memuat{ padding:40px 0; text-align:center; color:var(--kelabu); }

/* Troli */
.troli{ position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom,0px)); z-index:15; padding:0 12px 10px; pointer-events:none; }
.troli-dalam{ pointer-events:auto; max-width:656px; margin:0 auto; background:var(--dakwat); color:var(--kertas); border-radius:16px; padding:10px 10px 10px 18px; display:flex; align-items:center; gap:12px; box-shadow:var(--bayang); }
.troli-dalam .jum{ font-weight:700; }
.troli-dalam .jum small{ display:block; font-weight:500; opacity:.75; font-size:.8rem; }
.troli-dalam .btn{ margin-left:auto; background:var(--kupon); color:#2B2000; white-space:nowrap; flex:none; }

/* Nav bawah */
nav.bawah{ position:fixed; left:0; right:0; bottom:0; z-index:16; background:var(--kad); border-top:1px solid var(--garis); padding-bottom:env(safe-area-inset-bottom,0px); }
nav.bawah .dalam{ max-width:680px; margin:0 auto; display:flex; }
nav.bawah button{ flex:1; border:0; background:transparent; padding:8px 4px 10px; font-size:.78rem; font-weight:600; color:var(--kelabu); display:flex; flex-direction:column; align-items:center; gap:2px; min-height:64px; }
nav.bawah button svg{ width:24px; height:24px; }
nav.bawah button[aria-current="page"]{ color:var(--hijau); }

/* Slip pesanan — elemen utama */
.slip{ position:relative; background:var(--kad); border-radius:14px 14px 0 0; padding:18px 18px 26px; margin-bottom:22px; box-shadow:var(--bayang);
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, #0000 98%, #000) 50% 100% / 18px 100% repeat-x;
          mask: radial-gradient(circle 7px at 50% 100%, #0000 98%, #000) 50% 100% / 18px 100% repeat-x; }
.slip .no{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1.5px dashed var(--garis); padding-bottom:10px; margin-bottom:10px; }
.slip .no strong{ font-size:1.25rem; font-weight:800; letter-spacing:.02em; }
.slip ul{ list-style:none; padding:0; margin:0 0 10px; }
.slip li{ display:flex; justify-content:space-between; padding:3px 0; }
.slip .jumlah{ display:flex; justify-content:space-between; border-top:1.5px dashed var(--garis); padding-top:10px; font-weight:800; font-size:1.1rem; }
.slip .cop-catuan{ display:inline-block; margin:2px 0 12px 4px; border:2.5px solid var(--kupon); color:var(--kupon-ink); background:var(--kupon-bg); font-weight:800; font-size:.78rem; padding:4px 10px; border-radius:8px; transform:rotate(-8deg); }
.jejak{ display:flex; gap:4px; margin-top:12px; }
.jejak span{ flex:1; height:5px; border-radius:3px; background:var(--garis); }
.jejak span.on{ background:var(--hijau); }
.jejak-label{ display:flex; justify-content:space-between; font-size:.74rem; color:var(--kelabu); margin-top:4px; }

/* Borang */
.borang{ background:var(--kad); border:1px solid var(--garis); border-radius:14px; padding:16px; display:grid; gap:12px; }
label.medan{ display:grid; gap:4px; font-size:.86rem; font-weight:600; }
.medan input,.medan select{ border:1.5px solid var(--garis); background:var(--kertas); border-radius:10px; padding:11px 12px; font-size:1rem; width:100%; }
.medan input:focus,.medan select:focus{ outline:none; border-color:var(--hijau); }
.baris2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.pilihan{ display:grid; gap:8px; }
.pilihan label{ display:flex; gap:12px; align-items:flex-start; border:1.5px solid var(--garis); border-radius:12px; padding:12px; background:var(--kertas); }
.pilihan label:has(input:checked){ border-color:var(--hijau); background:var(--sage); }
.pilihan label:has(input:disabled){ opacity:.55; }
.pilihan input{ margin-top:4px; accent-color:var(--hijau); width:18px; height:18px; }
.pilihan small{ display:block; color:var(--kelabu); }

/* Log masuk */
.login{ min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.login-kotak{ width:100%; max-width:400px; }
.login-kotak .logo{ width:64px; height:64px; border-radius:18px; background:var(--hijau); display:grid; place-items:center; margin-bottom:18px; }
.login-kotak h1{ font-size:2rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; margin-bottom:6px; }
.login-kotak > p{ color:var(--kelabu); margin-bottom:22px; }
.demo-akaun{ margin-top:18px; font-size:.86rem; color:var(--kelabu); }
.demo-akaun button{ display:flex; width:100%; justify-content:space-between; gap:8px; border:1px solid var(--garis); background:var(--kad); border-radius:10px; padding:10px 12px; margin-top:6px; text-align:left; }
.demo-akaun button b{ color:var(--dakwat); }

.bantuan{ font-size:.8rem; font-weight:400; color:var(--kelabu); }
.setuju{ display:flex; gap:10px; align-items:flex-start; font-size:.86rem; }
.setuju input{ margin-top:3px; width:18px; height:18px; accent-color:var(--hijau); flex:none; }
.pautan{ background:none; border:0; color:var(--hijau); font-weight:700; padding:8px 0; text-decoration:underline; text-underline-offset:3px; }
.pin-besar{ font-size:2.2rem; font-weight:800; letter-spacing:.2em; text-align:center; background:var(--kupon-bg); color:var(--kupon-ink); border:2px dashed var(--kupon); border-radius:14px; padding:14px; margin:12px 0; }
.cari{ border:1.5px solid var(--garis); background:var(--kad); border-radius:12px; padding:11px 14px; width:100%; margin-bottom:12px; font-size:1rem; }
.cari:focus{ outline:none; border-color:var(--hijau); }

.kl-wrap{ position:relative; display:block; }
.kl-wrap input{ padding-right:72px !important; }
.kl-lihat{ position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:var(--sage); color:var(--hijau); font-weight:700; font-size:.78rem; border-radius:8px; padding:6px 10px; }
.input-kod{ font-size:1.6rem !important; letter-spacing:.35em; text-align:center; font-weight:800; }

/* ---------- Cetakan ---------- */
#kawasanCetak{ display:none; }
.helaian{ position:relative; overflow:hidden; background:#fff; page-break-after:always; break-after:page; }
.helaian:last-child{ page-break-after:auto; break-after:auto; }
.helaian .kotak{ position:absolute; box-sizing:border-box; overflow:hidden; }
.lbl{ box-sizing:border-box; width:100%; height:100%; padding:2.5mm 3mm; display:flex; flex-direction:column; gap:1mm; color:#000; font-family:var(--font); line-height:1.2; overflow:hidden; }
.lbl-atas{ display:flex; justify-content:space-between; align-items:center; gap:2mm; }
.lbl-sesi{ background:#000; color:#fff; font-weight:800; padding:.6mm 2mm; border-radius:1.2mm; white-space:nowrap; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.lbl-no{ font-weight:700; white-space:nowrap; }
.lbl-nama{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lbl-info{ display:flex; gap:3mm; flex-wrap:wrap; }
.lbl-menu{ flex:1; border-top:.3mm solid #000; border-bottom:.3mm dashed #000; padding:1mm 0; display:flex; flex-direction:column; overflow:hidden; }
.lbl-menu span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lbl-kaki{ display:flex; justify-content:space-between; gap:2mm; white-space:nowrap; }
.lbl-besar{ font-size:9.5pt; } .lbl-besar .lbl-sesi{ font-size:10.5pt; } .lbl-besar .lbl-nama{ font-size:14pt; } .lbl-besar .lbl-menu{ font-size:10.5pt; } .lbl-besar .lbl-kaki{ font-size:8.5pt; }
.lbl-sederhana{ font-size:8.5pt; } .lbl-sederhana .lbl-sesi{ font-size:9pt; } .lbl-sederhana .lbl-nama{ font-size:12pt; } .lbl-sederhana .lbl-menu{ font-size:9pt; } .lbl-sederhana .lbl-kaki{ font-size:7.5pt; }
.lbl-kecil{ font-size:7pt; padding:1.5mm 2.5mm; gap:.4mm; } .lbl-kecil .lbl-sesi{ font-size:7.5pt; } .lbl-kecil .lbl-nama{ font-size:10pt; } .lbl-kecil .lbl-menu{ font-size:7.5pt; flex-direction:row; flex-wrap:wrap; gap:0 2mm; padding:.5mm 0; } .lbl-kecil .lbl-kaki{ font-size:6.5pt; }

.lap-kertas{ background:#fff; color:#111; border:1px solid var(--garis); border-radius:14px; padding:18px; overflow-x:auto; box-shadow:var(--bayang); }
.laporan{ color:#111; font-size:10pt; min-width:560px; }
.laporan h2{ font-size:15pt; font-weight:800; margin:0; }
.laporan h3{ font-size:11pt; font-weight:800; margin:16px 0 6px; }
.lap-kepala{ border-bottom:2px solid #111; padding-bottom:8px; margin-bottom:6px; }
.lap-kepala > p{ color:#444; margin:0 0 6px; }
.lap-meta td{ padding:1px 12px 1px 0; font-size:9pt; } .lap-meta td:nth-child(odd){ color:#555; }
.lap-kad{ width:calc(100% - 2px); box-sizing:border-box; display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #bbb; }
.lap-kad div{ padding:6px 10px; border:1px solid #ddd; } .lap-kad span{ display:block; font-size:8.5pt; color:#555; } .lap-kad b{ font-size:13pt; }
.lap-jadual{ width:calc(100% - 2px); border-collapse:collapse; font-size:9pt; }
.lap-jadual th,.lap-jadual td{ border:1px solid #bbb; padding:3px 6px; text-align:left; vertical-align:top; }
.lap-jadual th{ background:#eef2f0; font-weight:700; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.lap-jadual .n{ text-align:right; font-variant-numeric:tabular-nums; }
.lap-perinci{ font-size:8pt; table-layout:fixed; } .lap-perinci td{ overflow-wrap:anywhere; } .lap-perinci tr.batal td{ color:#888; text-decoration:line-through; }
.lap-perinci thead{ display:table-header-group; } .lap-perinci tr{ break-inside:avoid; }
.lap-tt{ display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:36px; break-inside:avoid; }
.lap-tt span{ display:block; border-bottom:1px solid #111; height:40px; margin:4px 0; }
.lap-tt p{ margin:0; font-size:9pt; }
.lap-kosong{ padding:24px 0; color:#555; }

@media print{
  :root{ padding:0 !important; }
  html,body{ background:#fff !important; color:#000 !important; }
  body > *:not(#kawasanCetak){ display:none !important; }
  #kawasanCetak{ display:block; }
  .cetak-laporan .laporan{ min-width:0; }
  .cetak-laporan .lap-bhg5{ page:landskap; break-before:page; }
}

/* Dialog */
dialog{ border:0; padding:0; width:min(560px, 100%); max-height:92vh; border-radius:20px 20px 0 0; margin:auto auto 0; background:var(--kertas); color:var(--dakwat); }
@media (min-width:600px){ dialog{ border-radius:20px; margin:auto; } }
dialog::backdrop{ background:rgba(8,20,17,.55); }
.dlg-isi{ padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); overflow-y:auto; max-height:92vh; }
.dlg-atas{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.dlg-atas h2{ font-size:1.25rem; font-weight:800; }
.btn-tutup{ border:0; background:var(--sage); width:36px; height:36px; border-radius:50%; font-size:1.2rem; line-height:1; }

.toast{ position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--dakwat); color:var(--kertas); padding:10px 16px; border-radius:12px; font-weight:600; font-size:.9rem; z-index:100; max-width:calc(100% - 32px); box-shadow:var(--bayang); }
.toast.ralat{ background:var(--merah); color:#fff; }

.penapis{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.penapis button{ border:1.5px solid var(--garis); background:var(--kad); border-radius:999px; padding:6px 12px; font-size:.85rem; font-weight:600; }
.penapis button[aria-pressed="true"]{ background:var(--dakwat); color:var(--kertas); border-color:var(--dakwat); }
.ringkasan-dapur{ background:var(--sage); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
.ringkasan-dapur ul{ list-style:none; padding:0; margin:8px 0 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:4px 16px; }
.ringkasan-dapur li span{ padding-right:12px; }
.ringkasan-dapur li{ display:flex; justify-content:space-between; font-size:.92rem; }
.ringkasan-dapur li b{ font-size:1rem; }
.baris-alat{ display:flex; gap:10px; align-items:end; margin-bottom:14px; }
.baris-alat .medan{ flex:1; }

@media (prefers-reduced-motion: no-preference){

<body>

<div id="skrinLogin" class="login tersembunyi"></div>

<div id="skrinApp" class="tersembunyi">
  <header class="atas">
    <div id="jalurDemo" class="demo-jalur tersembunyi">Mod demo: data disimpan dalam pelayar ini sahaja</div>
    <div class="atas-dalam">
      <div class="jenama">Makanan HKL<small>Tempahan kakitangan</small></div>
      <div class="pengguna" id="infoPengguna"></div>
      <button class="btn-keluar" data-act="akaun">Akaun</button>
    </div>
  </header>
  <main id="main"></main>
  <div class="troli tersembunyi" id="troli"></div>
  <nav class="bawah" aria-label="Navigasi utama"><div class="dalam" id="nav"></div></nav>
</div>

<dialog id="dlg"><div class="dlg-isi" id="dlgIsi"></div></dialog>
<div id="kawasanCetak"></div>

<script>
/* ================= KONFIGURASI ================= */
const CONFIG = {
  API_URL: '' // Pilihan B (GitHub Pages): tampal URL Web App (…/exec). Pilihan A (dalam Apps Script): biarkan kosong.
};

const SESI = ['Sarapan', 'Makan Tengah Hari', 'Minum Petang', 'Makan Malam'];
const KATEGORI = ['Nasi', 'Lauk', 'Mi', 'Roti', 'Set', 'Minuman', 'Kuih', 'Buah'];
const ALIRAN = ['Baru', 'Disediakan', 'Siap', 'Dihantar'];
const PERANAN = { STAF: 'Kakitangan', PENGUSAHA: 'Pengusaha Kafeteria', DIETETIK: 'Pegawai Dietetik', ADMIN: 'Pentadbir' };
const JAWATAN = ['Pegawai Perubatan', 'Pegawai Perubatan Siswazah (HO)', 'Pakar Perubatan', 'Jururawat', 'Penolong Pegawai Perubatan',
  'Pegawai Farmasi', 'Juru X-Ray / Pengimejan', 'Pembantu Perawatan Kesihatan', 'Staf Pentadbiran', 'Staf Sokongan', 'Lain-lain'];
const STATUS_AKAUN = ['Menunggu', 'Aktif', 'Ditolak', 'Digantung'];
const CATUAN_MAX_HIDANGAN = 1;
// Dikesan automatik: dibuka dari URL Apps Script (pilihan A) → guna google.script.run
const DALAM_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
const DEMO = !CONFIG.API_URL && !DALAM_GAS;
const TZ = 'Asia/Kuala_Lumpur';

/* ================= UTILITI ================= */
const $ = s => document.querySelector(s);
const hariIni = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); // YYYY-MM-DD waktu Malaysia
const jam = () => Number(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hour12: false }).format(new Date()));
const sesiSemasa = () => { const h = jam(); return h < 10 ? SESI[0] : h < 15 ? SESI[1] : h < 18 ? SESI[2] : SESI[3]; };
const rm = n => 'RM ' + Number(n || 0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function tarikhPanjang(t) {
  const [y, m, d] = t.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
const simpan = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let toastTimer;
function toast(msg, ralat) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (ralat ? ' ralat' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
const memuat = () => '<div class="memuat">Memuatkan…</div>';
const chip = s => `<span class="chip ${esc(s)}">${esc(s)}</span>`;
const opsyen = (arr, pilih) => arr.map(v => `<option ${v === pilih ? 'selected' : ''}>${esc(v)}</option>`).join('');

/* ================= API ================= */
const S = { token: null, user: null, view: null, data: {}, timer: null };

async function api(action, data = {}) {
  const body = { action, token: S.token, data };
  let res;
  if (DEMO) {
    await new Promise(r => setTimeout(r, 120));
    res = Mock.handle(body);
  } else if (DALAM_GAS) {
    try {
      res = await new Promise((ok, gagal) => google.script.run.withSuccessHandler(ok).withFailureHandler(gagal).apiGs(body));
    } catch (e) { throw new Error('Tiada sambungan ke pelayan. Semak internet dan cuba lagi.'); }
  } else {
    try {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      res = await r.json();
    } catch (e) { throw new Error('Tiada sambungan ke pelayan. Semak internet dan cuba lagi.'); }
  }
  if (!res.ok) {
    if (res.error === 'SESI_TAMAT') { logout(); throw new Error('Sesi tamat. Sila log masuk semula.'); }
    throw new Error(res.error);
  }
  return res.data;
}

/* ================= LOG MASUK ================= */
const DEMO_KL = 'Demo1234';
const medanKL = (name, label, ac, bantuan = '') => `<label class="medan">${label}
  <span class="kl-wrap"><input name="${name}" type="password" autocomplete="${ac}" required minlength="8">
  <button type="button" class="kl-lihat" data-act="lihatKL" aria-label="Papar kata laluan">Papar</button></span>
  ${bantuan ? `<span class="bantuan">${bantuan}</span>` : ''}</label>`;
const SYARAT_KL = 'Sekurang-kurangnya 8 aksara, mengandungi huruf dan nombor.';
const klLemah = kl => kl.length < 8 || !/[A-Za-z]/.test(kl) || !/\d/.test(kl);
function kiraanSemula(btn, saat = 60) {
  const asal = btn.dataset.asal || btn.textContent; btn.dataset.asal = asal; btn.disabled = true;
  const tick = () => { if (!btn.isConnected) return; if (saat <= 0) { btn.disabled = false; btn.textContent = asal; return; } btn.textContent = `${asal} (${saat--}s)`; setTimeout(tick, 1000); };
  tick();
}
const kotakDemoKod = r => DEMO && r && r.kodDemo ? `<div class="kupon" style="margin:0 0 14px"><div><b>Mod demo: emel tidak dihantar</b>Kod anda ialah <b style="display:inline;font-size:1.1rem">${r.kodDemo}</b></div></div>` : '';
function skrin(html) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = $('#skrinLogin'); el.innerHTML = `<div class="login-kotak">${html}</div>`;
  $('#skrinApp').classList.add('tersembunyi'); el.classList.remove('tersembunyi'); window.scrollTo(0, 0);
  return el;
}

function paparLogin(idIsi = '') {
  skrin(`
      <div class="logo">${ikon('dulang', '#fff', 34)}</div>
      <h1>Tempahan makanan kakitangan</h1>
      <p>Log masuk dengan ID staf dan kata laluan anda.</p>
      <form class="borang" id="fLogin">
        <label class="medan">ID staf<input name="id" autocomplete="username" autocapitalize="characters" required value="${esc(idIsi)}"></label>
        ${medanKL('kl', 'Kata laluan', 'current-password')}
        <button class="btn btn-penuh" type="submit">Log masuk</button>
        <button type="button" class="pautan" data-act="lupa" style="justify-self:start;padding:0">Lupa kata laluan?</button>
      </form>
      <button class="btn btn-garis btn-penuh" style="margin-top:12px" data-act="daftar">Daftar akaun baharu</button>
      ${DEMO ? `<div class="demo-akaun">Mod demo. Pilih akaun untuk cuba (kata laluan ${DEMO_KL}):
        ${Mock.users().map(u => `<button type="button" data-act="demoLogin" data-v="${u.ID_Staf}"><b>${esc(u.Nama)}</b><span>${PERANAN[u.Peranan]}</span></button>`).join('')}
      </div>` : ''}`);
  if (idIsi) $('#fLogin [name=kl]').focus();
  $('#fLogin').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    await cubaLogin(f.get('id'), f.get('kl'), e.submitter);
  };
}
async function cubaLogin(id, kl, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api('login', { id, kataLaluan: kl });
    S.token = r.token; S.user = r.user; simpan.set('hkl_sesi', r);
    mulaApp();
  } catch (err) {
    if (err.message === 'EMEL_BELUM_SAH') { paparSahkan(String(id).trim().toUpperCase(), '', true); toast('Sahkan emel anda dahulu untuk mengaktifkan akaun.'); }
    else toast(err.message, true);
  }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
}

function paparDaftar() {
  skrin(`
      <h1>Daftar akaun</h1>
      <p>Akaun aktif serta-merta selepas anda mengesahkan emel.</p>
      <form class="borang" id="fDaftar" novalidate>
        <label class="medan">No. pekerja / ID staf<input name="ID_Staf" autocapitalize="characters" autocomplete="username" required maxlength="20">
          <span class="bantuan">Ini ID log masuk anda. Jangan guna No. Kad Pengenalan.</span></label>
        <label class="medan">Nama penuh<input name="Nama" autocomplete="name" required></label>
        <label class="medan">Jawatan<select name="Jawatan" required><option value="">Pilih jawatan</option>${opsyen(JAWATAN)}</select></label>
        <label class="medan">Jabatan / wad bertugas<input name="Lokasi_Wad" required placeholder="cth. Wad 5A, Jabatan Kecemasan">
          <span class="bantuan">Jadi lokasi hantaran lalai. Boleh diubah setiap kali pesan.</span></label>
        <label class="medan">No. telefon<input name="No_Tel" type="tel" inputmode="tel" autocomplete="tel" required placeholder="0123456789"></label>
        <label class="medan">Emel<input name="Emel" type="email" autocomplete="email" required>
          <span class="bantuan">Kod pengesahan dan kod lupa kata laluan dihantar ke sini.</span></label>
        <label class="medan">Tarikh tamat penempatan (pilihan)<input name="Tarikh_Tamat" type="date" min="${hariIni()}">
          <span class="bantuan">Untuk HO atau pegawai bergilir. Akaun tamat secara automatik selepas tarikh ini.</span></label>
        ${medanKL('kataLaluan', 'Kata laluan', 'new-password', SYARAT_KL)}
        ${medanKL('kataLaluan2', 'Ulang kata laluan', 'new-password')}
        <label class="setuju"><input type="checkbox" name="setuju" required>
          <span>Saya bersetuju maklumat ini disimpan dan digunakan untuk urusan tempahan makanan hospital sahaja.</span></label>
        <button class="btn btn-penuh" type="submit">Daftar</button>
      </form>
      <button class="pautan" data-act="keLogin">Sudah ada akaun? Log masuk</button>`);
  $('#fDaftar').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const semak = !d.ID_Staf.trim() ? 'Isi No. pekerja / ID staf.' : d.Nama.trim().length < 3 ? 'Isi nama penuh.' : !d.Jawatan ? 'Pilih jawatan.'
      : !d.Lokasi_Wad.trim() ? 'Isi jabatan atau wad.' : !/^0\d{8,10}$/.test(d.No_Tel.replace(/[\s-]/g, '')) ? 'No. telefon tidak sah (cth. 0123456789).'
      : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.Emel.trim()) ? 'Isi emel yang sah.'
      : klLemah(d.kataLaluan) ? 'Kata laluan: ' + SYARAT_KL.toLowerCase() : d.kataLaluan !== d.kataLaluan2 ? 'Kata laluan tidak sepadan.'
      : !d.setuju ? 'Tandakan persetujuan untuk teruskan.' : '';
    if (semak) return toast(semak, true);
    delete d.kataLaluan2; delete d.setuju;
    e.submitter.disabled = true;
    try {
      const r = await api('daftar', d);
      const id = d.ID_Staf.trim().toUpperCase();
      if (r.perluKod) { paparSahkan(id, r.emel, false, r); if (r.amaran) toast(r.amaran, true); }
      else skrinBerjaya(r.status === 'Aktif' ? 'Akaun anda sudah aktif' : 'Pendaftaran diterima',
        r.status === 'Aktif' ? 'Log masuk dengan ID staf dan kata laluan yang baru didaftarkan.' : 'Pentadbir akan menyemak pendaftaran anda.', id);
    } catch (err) { toast(err.message, true); e.submitter.disabled = false; }
  };
}

function paparSahkan(id, emelSorok, dariLogin, respons) {
  skrin(`
      <div class="logo">${ikon('emel', '#fff', 34)}</div>
      <h1>Sahkan emel</h1>
      <p>${dariLogin ? `Akaun <b>${esc(id)}</b> belum disahkan. Tekan "Hantar kod" untuk terima kod 6 digit di emel berdaftar.`
        : `Kod 6 digit telah dihantar ke <b>${esc(emelSorok || 'emel anda')}</b>. Semak juga folder spam.`}</p>
      <div id="demoKod">${kotakDemoKod(respons)}</div>
      <form class="borang" id="fSahkan">
        <label class="medan">Kod pengesahan<input name="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" required class="input-kod"></label>
        <button class="btn btn-penuh" type="submit">Sahkan dan aktifkan akaun</button>
        <button class="btn btn-garis btn-penuh" type="button" id="btnHantarSemula">${dariLogin ? 'Hantar kod' : 'Hantar semula kod'}</button>
      </form>
      <button class="pautan" data-act="keLogin">Kembali ke log masuk</button>`);
  const btnS = $('#btnHantarSemula');
  if (!dariLogin) kiraanSemula(btnS);
  btnS.onclick = async () => {
    btnS.disabled = true;
    try { const r = await api('hantarKod', { ID_Staf: id, tujuan: 'daftar' }); toast(r.mesej); $('#demoKod').innerHTML = kotakDemoKod(r); kiraanSemula(btnS); }
    catch (err) { toast(err.message, true); btnS.disabled = false; }
  };
  $('#fSahkan').onsubmit = async e => {
    e.preventDefault();
    const kod = new FormData(e.target).get('kod').trim();
    if (!/^\d{6}$/.test(kod)) return toast('Masukkan kod 6 digit.', true);
    e.submitter.disabled = true;
    try {
      const r = await api('sahkanEmel', { ID_Staf: id, kod });
      if (r.status === 'Aktif') skrinBerjaya('Akaun anda sudah aktif', 'Emel disahkan. Log masuk sekarang untuk mula membuat tempahan.', id);
      else skrinBerjaya('Emel disahkan', 'Akaun anda menunggu kelulusan pentadbir. Cuba log masuk semula selepas diluluskan.', id);
    } catch (err) { toast(err.message, true); e.submitter.disabled = false; }
  };
}

function paparLupa() {
  skrin(`
      <div class="logo">${ikon('kunci', '#fff', 34)}</div>
      <h1>Lupa kata laluan</h1>
      <p>Masukkan ID staf dan emel yang didaftarkan. Kami akan hantar kod untuk mencipta kata laluan baharu.</p>
      <form class="borang" id="fLupa1">
        <label class="medan">ID staf<input name="ID_Staf" autocapitalize="characters" autocomplete="username" required></label>
        <label class="medan">Emel berdaftar<input name="Emel" type="email" autocomplete="email" required></label>
        <button class="btn btn-penuh" type="submit" id="btnKodReset">Hantar kod</button>
      </form>
      <div id="lupaLangkah2"></div>
      <p class="kecil" style="margin-top:12px">Tiada emel berdaftar atau tidak lagi guna emel tersebut? Hubungi pentadbir untuk kata laluan sementara.</p>
      <button class="pautan" data-act="keLogin">Kembali ke log masuk</button>`);
  $('#fLupa1').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const btn = $('#btnKodReset'); btn.disabled = true;
    try {
      const r = await api('hantarKod', { ID_Staf: d.ID_Staf, Emel: d.Emel, tujuan: 'reset' });
      btn.dataset.asal = 'Hantar semula kod'; kiraanSemula(btn);
      $('#fLupa1 [name=ID_Staf]').readOnly = true;
      if (!$('#fLupa2')) langkahLupa2(d.ID_Staf.trim().toUpperCase());
      $('#lupaDemo').innerHTML = kotakDemoKod(r);
      toast(r.mesej);
    } catch (err) { toast(err.message, true); btn.disabled = false; }
  };
}
function langkahLupa2(id) {
  $('#lupaLangkah2').innerHTML = `
    <form class="borang" id="fLupa2" style="margin-top:14px">
      <div id="lupaDemo"></div>
      <label class="medan">Kod dari emel<input name="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required class="input-kod">
        <span class="bantuan">Sah selama 10 minit. Semak juga folder spam.</span></label>
      ${medanKL('baru', 'Kata laluan baharu', 'new-password', SYARAT_KL)}
      ${medanKL('ulang', 'Ulang kata laluan baharu', 'new-password')}
      <button class="btn btn-penuh" type="submit">Simpan kata laluan baharu</button>
    </form>`;
  $('#fLupa2 [name=kod]').focus();
  $('#fLupa2').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if (!/^\d{6}$/.test(d.kod.trim())) return toast('Masukkan kod 6 digit.', true);
    if (klLemah(d.baru)) return toast('Kata laluan: ' + SYARAT_KL.toLowerCase(), true);
    if (d.baru !== d.ulang) return toast('Kata laluan tidak sepadan.', true);
    e.submitter.disabled = true;
    try {
      await api('resetKataLaluan', { ID_Staf: id, kod: d.kod.trim(), kataLaluanBaru: d.baru });
      skrinBerjaya('Kata laluan baharu disimpan', 'Log masuk dengan kata laluan baharu. Semua sesi lama pada peranti lain telah dilog keluar.', id);
    } catch (err) { toast(err.message, true); e.submitter.disabled = false; }
  };
}

function skrinBerjaya(tajuk, ayat, id) {
  skrin(`<div class="logo">${ikon('semak', '#fff', 34)}</div><h1>${esc(tajuk)}</h1><p>${esc(ayat)}</p>
    <button class="btn btn-penuh" data-act="keLogin" data-v="${esc(id || '')}">Log masuk</button>`);
}

function bukaAkaun() {
  bukaDialog('Akaun saya', `
    <div class="borang" style="margin-bottom:14px"><p class="nama">${esc(S.user.Nama)}</p>
      <p class="meta"><span>${esc(S.user.ID_Staf)}</span><span>${PERANAN[S.user.Peranan]}</span><span>${esc(S.user.Lokasi_Wad || '')}</span></p>
      ${S.user.Emel ? `<p class="kecil">${esc(S.user.Emel)}</p>` : ''}</div>
    <form id="fKL" class="borang"><b>Tukar kata laluan</b>
      ${medanKL('lama', 'Kata laluan semasa', 'current-password')}
      ${medanKL('baru', 'Kata laluan baharu', 'new-password', SYARAT_KL)}
      ${medanKL('ulang', 'Ulang kata laluan baharu', 'new-password')}
      <button class="btn" type="submit">Tukar kata laluan</button>
    </form>
    <button class="btn btn-bahaya btn-penuh" style="margin-top:14px" data-act="logout">Log keluar</button>`);
  $('#fKL').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if (klLemah(d.baru)) return toast('Kata laluan: ' + SYARAT_KL.toLowerCase(), true);
    if (d.baru !== d.ulang) return toast('Kata laluan baharu tidak sepadan.', true);
    e.submitter.disabled = true;
    try {
      const r = await api('tukarKataLaluan', { kataLaluanLama: d.lama, kataLaluanBaru: d.baru });
      S.token = r.token; S.user = r.user; simpan.set('hkl_sesi', r);
      tutupDialog(); toast('Kata laluan ditukar. Peranti lain telah dilog keluar.');
    } catch (err) { toast(err.message, true); e.submitter.disabled = false; }
  };
}

function logout() {
  tutupDialog();
  document.querySelectorAll('.toast').forEach(t => t.remove());
  S.token = null; S.user = null; simpan.del('hkl_sesi'); Troli.kosong(); clearInterval(S.timer);
  paparLogin();
}

/* ================= KERANGKA APP ================= */
const NAV = {
  STAF:      [['menu', 'Menu', 'dulang'], ['pesanan', 'Pesanan saya', 'resit']],
  PENGUSAHA: [['dapur', 'Pesanan masuk', 'loceng'], ['menuSaya', 'Menu saya', 'senarai']],
  DIETETIK:  [['semakan', 'Semakan', 'semak'], ['harian', 'Menu', 'kalendar'], ['catuan', 'Catuan', 'kupon'], ['laporan', 'Laporan', 'resit']],
  ADMIN:     [['pengguna', 'Pengguna', 'orang'], ['laporan', 'Laporan', 'resit']]
};
const navSaya = () => NAV[S.user.Peranan].concat(S.user.Pelulus && S.user.Peranan !== 'ADMIN' ? [['pengguna', 'Pengguna', 'orang']] : []);
function mulaApp() {
  $('#skrinLogin').classList.add('tersembunyi');
  $('#skrinApp').classList.remove('tersembunyi');
  $('#jalurDemo').classList.toggle('tersembunyi', !DEMO);
  $('#infoPengguna').innerHTML = `<b>${esc(S.user.Nama)}</b><span>${PERANAN[S.user.Peranan]}</span>`;
  tukarView(navSaya()[0][0]);
}
function lukisNav() {
  $('#nav').innerHTML = navSaya().map(([v, l, i]) =>
    `<button data-act="nav" data-v="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${ikon(i, 'currentColor', 24)}${l}</button>`).join('');
}
async function tukarView(v) {
  S.view = v; clearInterval(S.timer); lukisNav();
  $('#troli').classList.add('tersembunyi');
  window.scrollTo(0, 0);
  $('#main').innerHTML = memuat();
  try { await VIEWS[v](); }
  catch (err) { $('#main').innerHTML = `<div class="kosong">${esc(err.message)}<br><br><button class="btn btn-kecil" data-act="nav" data-v="${v}">Cuba lagi</button></div>`; }
}

/* ================= KAKITANGAN: MENU & TROLI ================= */
const Troli = {
  sesi: null, items: {},
  kosong() { this.items = {}; },
  bil() { return Object.values(this.items).reduce((a, b) => a + b, 0); },
  jumlah() { return Object.entries(this.items).reduce((a, [id, q]) => a + (S.data.peta?.[id]?.Harga_RM || 0) * q, 0); }
};

async function vMenu() {
  const d = await api('menuHariIni');
  S.data.menu = d;
  S.data.peta = {};
  d.menu.forEach(m => { if (m.Sesi_Makan === (Troli.sesi || sesiSemasa())) S.data.peta[m.ID_Menu] = m; });
  if (!Troli.sesi) Troli.sesi = sesiSemasa();
  lukisMenu();
}
function lukisMenu() {
  const d = S.data.menu, sesi = Troli.sesi;
  S.data.peta = {};
  const items = d.menu.filter(m => m.Sesi_Makan === sesi);
  items.forEach(m => S.data.peta[m.ID_Menu] = m);
  const c = d.catuan.find(x => x.Sesi_Catuan === sesi);
  $('#main').innerHTML = `
    <section class="kepala"><p>${tarikhPanjang(d.tarikh)}</p><h1>Menu hari ini</h1></section>
    <div class="segmen" role="tablist" aria-label="Sesi makan">
      ${SESI.map(s => `<button role="tab" aria-selected="${s === sesi}" data-act="pilihSesi" data-v="${esc(s)}">${esc(s)}<span class="bil">${d.menu.filter(m => m.Sesi_Makan === s).length}</span></button>`).join('')}
    </div>
    ${c ? `<div class="kupon ${c.Status_Tuntut === 'Dituntut' ? 'guna' : ''}">
        <div class="cop">Catuan<br>percuma</div>
        <div>${c.Status_Tuntut === 'Dituntut'
          ? `<b>Catuan ${esc(sesi.toLowerCase())} sudah digunakan</b><span class="kecil">Pesanan tambahan adalah berbayar.</span>`
          : `<b>Anda layak catuan untuk sesi ini</b>Pilih ${CATUAN_MAX_HIDANGAN} hidangan, kemudian pilih "Catuan percuma" semasa bayaran.`}</div>
      </div>` : ''}
    ${items.length ? `<ul class="senarai">${items.map(barisItem).join('')}</ul>`
      : `<div class="kosong">Belum ada menu disahkan untuk ${esc(sesi.toLowerCase())}. Pilih sesi lain atau semak semula nanti.</div>`}
  `;
  lukisTroli();
}
function barisItem(m) {
  const q = Troli.items[m.ID_Menu] || 0;
  return `<li class="item">
    <div><p class="nama">${esc(m.Nama_Sajian)}</p><p class="meta"><span>${esc(m.Kategori)}</span><span>${m.Anggaran_Kalori} kkal</span></p></div>
    <div class="kanan"><span class="harga">${rm(m.Harga_RM)}</span>
      ${q ? `<span class="stepper"><button data-act="kurang" data-v="${m.ID_Menu}" aria-label="Kurangkan">−</button><span>${q}</span><button data-act="tambah" data-v="${m.ID_Menu}" aria-label="Tambah">+</button></span>`
          : `<button class="btn-tambah" data-act="tambah" data-v="${m.ID_Menu}">Tambah</button>`}
    </div></li>`;
}
function lukisTroli() {
  const el = $('#troli'), n = Troli.bil();
  if (!n || S.view !== 'menu') { el.classList.add('tersembunyi'); return; }
  el.classList.remove('tersembunyi');
  el.innerHTML = `<div class="troli-dalam"><div class="jum">${rm(Troli.jumlah())}<small>${n} hidangan, ${esc(Troli.sesi.toLowerCase())}</small></div>
    <button class="btn" data-act="semakTroli">Semak pesanan</button></div>`;
}
function bukaSemakan() {
  const c = S.data.menu.catuan.find(x => x.Sesi_Catuan === Troli.sesi && x.Status_Tuntut !== 'Dituntut');
  const bolehCatuan = c && Troli.bil() <= CATUAN_MAX_HIDANGAN;
  const barisan = Object.entries(Troli.items).map(([id, q]) => {
    const m = S.data.peta[id]; return `<li><span>${esc(m.Nama_Sajian)} ×${q}</span><span>${rm(m.Harga_RM * q)}</span></li>`;
  }).join('');
  bukaDialog('Semak pesanan', `
    <div class="slip" style="margin-bottom:18px"><div class="no"><b>${esc(Troli.sesi)}</b><span class="kecil">${new Date().toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' })}</span></div>
      <ul>${barisan}</ul><div class="jumlah"><span>Jumlah</span><span id="jumSemak">${rm(bolehCatuan ? 0 : Troli.jumlah())}</span></div></div>
    <form id="fPesan" class="borang">
      <label class="medan">Hantar ke (lokasi / wad)<input name="Lokasi_Wad" value="${esc(S.user.Lokasi_Wad || '')}" required></label>
      <div class="pilihan" role="radiogroup" aria-label="Cara bayaran">
        <label><input type="radio" name="Jenis_Bayaran" value="Catuan" ${bolehCatuan ? 'checked' : 'disabled'}>
          <span><b>Catuan percuma</b><small>${!c ? 'Tiada catuan untuk sesi ini.' : Troli.bil() > CATUAN_MAX_HIDANGAN ? `Catuan meliputi ${CATUAN_MAX_HIDANGAN} hidangan sahaja. Kurangkan troli untuk guna catuan.` : 'Ditanggung oleh hospital.'}</small></span></label>
        <label><input type="radio" name="Jenis_Bayaran" value="Berbayar" ${bolehCatuan ? '' : 'checked'}>
          <span><b>Berbayar</b><small>Bayar ${rm(Troli.jumlah())} semasa ambil atau terima makanan.</small></span></label>
      </div>
      <button class="btn btn-penuh" type="submit">Hantar pesanan</button>
    </form>`);
  $('#fPesan').onchange = e => { if (e.target.name === 'Jenis_Bayaran') $('#jumSemak').textContent = rm(e.target.value === 'Catuan' ? 0 : Troli.jumlah()); };
  $('#fPesan').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = e.submitter; btn.disabled = true;
    try {
      const p = await api('buatPesanan', {
        sesi: Troli.sesi, Lokasi_Wad: f.get('Lokasi_Wad'), Jenis_Bayaran: f.get('Jenis_Bayaran'),
        items: Object.entries(Troli.items).map(([ID_Menu, qty]) => ({ ID_Menu, qty }))
      });
      Troli.kosong();
      bukaDialog('Pesanan dihantar', slip(p, true) + `<button class="btn btn-penuh" data-act="nav" data-v="pesanan">Lihat pesanan saya</button>`);
      S.data.menu = await api('menuHariIni'); lukisMenu();
    } catch (err) { toast(err.message, true); btn.disabled = false; }
  };
}

function slip(p, baru) {
  const lines = String(p.Item_Dipesan).split('; ').map(x => { const m = x.match(/^(.*) x(\d+)$/); return m ? `<li><span>${esc(m[1])}</span><span>×${m[2]}</span></li>` : `<li>${esc(x)}</li>`; }).join('');
  const idx = ALIRAN.indexOf(p.Status_Siap);
  return `<article class="slip ${baru ? 'baru' : ''}">
    <div class="no"><strong>${esc(p.ID_Pesanan)}</strong>${chip(p.Status_Siap)}</div>
    <p class="kecil">${esc(p.Tarikh_Masa)}, ${esc(p.Sesi_Makan || '')}</p>
    <p class="kecil" style="margin-bottom:10px">Hantar ke ${esc(p.Lokasi_Wad)}</p>
    ${p.Jenis_Bayaran === 'Catuan' ? '<span class="cop-catuan">Catuan</span>' : ''}
    <ul>${lines}</ul>
    <div class="jumlah"><span>${p.Jenis_Bayaran === 'Catuan' ? 'Catuan percuma' : 'Berbayar'}</span><span>${rm(p.Jumlah_RM)}</span></div>
    ${idx >= 0 ? `<div class="jejak">${ALIRAN.map((_, i) => `<span class="${i <= idx ? 'on' : ''}"></span>`).join('')}</div>
      <div class="jejak-label">${ALIRAN.map(a => `<span>${a}</span>`).join('')}</div>` : ''}
  </article>`;
}

async function vPesananSaya() {
  const senarai = await api('pesananSaya');
  $('#main').innerHTML = `<section class="kepala"><p>30 pesanan terkini</p><h1>Pesanan saya</h1></section>
    ${senarai.length ? senarai.map(p => slip(p)).join('') : `<div class="kosong">Anda belum membuat pesanan.<br><br><button class="btn btn-kecil" data-act="nav" data-v="menu">Lihat menu hari ini</button></div>`}`;

/* ================= PENGUSAHA ================= */
async function vDapur() {
  const tarikh = S.data.tarikhDapur || hariIni();
  const senarai = await api('pesananMasuk', { tarikh });
  S.data.dapur = senarai;
  lukisDapur(tarikh);
  S.timer = setInterval(async () => {
    if (S.view !== 'dapur' || $('#dlg').open) return;
    try { S.data.dapur = await api('pesananMasuk', { tarikh }); lukisDapur(tarikh); } catch (e) {}
  }, 30000);
}
function lukisDapur(tarikh) {
  const semua = S.data.dapur, tapis = S.data.tapisDapur || 'Aktif';
  const aktif = p => p.Status_Siap === 'Baru' || p.Status_Siap === 'Disediakan';
  const papar = semua.filter(p => tapis === 'Semua' ? true : tapis === 'Aktif' ? aktif(p) : p.Status_Siap === tapis)
    .sort((a, b) => (a.Tarikh_Masa < b.Tarikh_Masa ? -1 : 1));
  const agregat = {};
  semua.filter(aktif).forEach(p => String(p.Item_Dipesan).split('; ').forEach(x => {
    const m = x.match(/^(.*) x(\d+)$/); if (m) agregat[m[1]] = (agregat[m[1]] || 0) + Number(m[2]);
  }));
  const kutipan = semua.filter(p => p.Status_Siap !== 'Dibatalkan').reduce((a, p) => a + Number(p.Jumlah_RM || 0), 0);
  const kira = s => semua.filter(p => s === 'Aktif' ? aktif(p) : s === 'Semua' ? true : p.Status_Siap === s).length;

  $('#main').innerHTML = `
    <section class="kepala"><p>${tarikhPanjang(tarikh)}</p><h1>Pesanan masuk</h1></section>
    <div class="baris-alat"><label class="medan">Tarikh<input type="date" id="tDapur" value="${tarikh}"></label>
      <button class="btn btn-garis btn-kecil" data-act="nav" data-v="dapur" style="height:46px">Muat semula</button>
      <button class="btn btn-kecil" data-act="labelSemua" style="height:46px">Cetak label</button></div>
    ${Object.keys(agregat).length ? `<div class="ringkasan-dapur"><b>Perlu disediakan</b><ul>${Object.entries(agregat).sort((a, b) => b[1] - a[1]).map(([n, q]) => `<li><span>${esc(n)}</span><b>${q}</b></li>`).join('')}</ul></div>` : ''}
    <div class="penapis">${['Aktif', 'Siap', 'Dihantar', 'Semua'].map(s => `<button aria-pressed="${s === tapis}" data-act="tapisDapur" data-v="${s}">${s} (${kira(s)})</button>`).join('')}</div>
    ${papar.length ? `<ul class="senarai">${papar.map(p => {
      const i = ALIRAN.indexOf(p.Status_Siap), seterus = i >= 0 && i < ALIRAN.length - 1 ? ALIRAN[i + 1] : null;
      return `<li>
        <div><p class="nama">${esc(p.ID_Pesanan)} ${chip(p.Status_Siap)} ${p.Jenis_Bayaran === 'Catuan' ? chip('Catuan') : ''}</p>
          <p class="meta"><span>${esc(String(p.Tarikh_Masa).slice(11))}</span><span>${esc(p.Nama_Staf || p.ID_Staf)}</span><span>${esc(p.Lokasi_Wad)}</span><span>${esc(p.Sesi_Makan || '')}</span></p>
          <p style="margin-top:4px">${esc(String(p.Item_Dipesan).replace(/; /g, ', ').replace(/ x(\d+)/g, ' ×$1'))}</p></div>
        <div class="harga">${rm(p.Jumlah_RM)}</div>
        <div class="tindakan">
          <button class="btn btn-kecil btn-garis" data-act="labelSatu" data-id="${p.ID_Pesanan}">Label</button>
          ${seterus ? `<button class="btn btn-kecil" data-act="statusPesanan" data-id="${p.ID_Pesanan}" data-v="${seterus}">Tandakan ${seterus.toLowerCase()}</button>` : ''}
          ${p.Status_Siap === 'Baru' ? `<button class="btn btn-kecil btn-bahaya" data-act="statusPesanan" data-id="${p.ID_Pesanan}" data-v="Dibatalkan">Batalkan</button>` : ''}
        </div></li>`;
    }).join('')}</ul>` : `<div class="kosong">Tiada pesanan dalam kategori ini.</div>`}
    <p class="kecil" style="margin-top:14px">Jumlah kutipan berbayar hari ini: <b>${rm(kutipan)}</b></p>`;
  $('#tDapur').onchange = e => { S.data.tarikhDapur = e.target.value; tukarView('dapur'); };
}

      </div>

    <h2 class="bahagian">Senarai menu (${senarai.length})</h2>

      <div><p class="nama">${esc(m.Nama_Sajian)}</p><p class="meta"><span>${esc(m.Kategori)}</span>${chip(m.Status_Pengesahan)}</p></div>

/* ================= DIETETIK ================= */
async function vSemakan() {
  const senarai = await api('daftarMenu');
  const draf = senarai.filter(m => m.Status_Pengesahan === 'Draf' || !m.Status_Pengesahan);
  const lain = senarai.filter(m => !draf.includes(m));
  const baris = (m, pending) => `<li>
    <div><p class="nama">${esc(m.Nama_Sajian)}</p><p class="meta"><span>${esc(m.Kategori)}</span>${pending ? '' : chip(m.Status_Pengesahan)}</p></div>
    <div class="harga">${rm(m.Harga_RM)}</div>
    <div class="tindakan">
      ${m.Status_Pengesahan !== 'Disahkan' ? `<button class="btn btn-kecil" data-act="sahkan" data-id="${m.ID_Menu}" data-v="Disahkan">Sahkan</button>` : ''}
      ${m.Status_Pengesahan !== 'Ditolak' ? `<button class="btn btn-kecil btn-bahaya" data-act="sahkan" data-id="${m.ID_Menu}" data-v="Ditolak">Tolak</button>` : ''}
    </div></li>`;
  $('#main').innerHTML = `
    <section class="kepala"><p>Menu daripada pengusaha kafeteria</p><h1>Semakan menu</h1></section>
    <h2 class="bahagian" style="margin-top:0">Menunggu pengesahan (${draf.length})</h2>
    ${draf.length ? `<ul class="senarai">${draf.map(m => baris(m, true)).join('')}</ul>` : '<div class="kosong">Tiada menu menunggu semakan.</div>'}
    <h2 class="bahagian">Sudah disemak (${lain.length})</h2>
    ${lain.length ? `<ul class="senarai">${lain.map(m => baris(m, false)).join('')}</ul>` : '<div class="kosong">Belum ada.</div>'}`;
}

async function vHarian() {
  const tarikh = S.data.tarikhHarian || hariIni();
  const [harian, daftar] = await Promise.all([api('menuHarian', { tarikh }), api('daftarMenu')]);
  const sah = daftar.filter(m => m.Status_Pengesahan === 'Disahkan');
  $('#main').innerHTML = `
    <section class="kepala"><p>${tarikhPanjang(tarikh)}</p><h1>Menu harian</h1></section>
    <div class="baris-alat"><label class="medan">Tarikh<input type="date" id="tHarian" value="${tarikh}"></label></div>
    <form class="borang" id="fHarian">
      <b>Masukkan menu ke sesi</b>
      ${sah.length ? `
      <label class="medan">Menu disahkan<select name="ID_Menu" required>${sah.map(m => `<option value="${m.ID_Menu}">${esc(m.Nama_Sajian)} (${rm(m.Harga_RM)})</option>`).join('')}</select></label>
      <div class="baris2">
        <label class="medan">Sesi<select name="Sesi_Makan">${opsyen(SESI, S.data.sesiHarian || sesiSemasa())}</select></label>
        <label class="medan">Anggaran kalori (kkal)<input name="Anggaran_Kalori" type="number" min="0" step="1" inputmode="numeric" required></label>
      </div>
      <button class="btn" type="submit">Tambah ke menu hari ini</button>` : '<p class="kecil">Belum ada menu disahkan. Sahkan menu di tab Semakan dahulu.</p>'}
    </form>
    ${SESI.map(s => {
      const r = harian.filter(h => h.Sesi_Makan === s);
      const kal = r.length ? Math.round(r.reduce((a, h) => a + h.Anggaran_Kalori, 0) / r.length) : 0;
      return `<h2 class="bahagian">${esc(s)} <span class="kecil">(${r.length} sajian${r.length ? `, purata ${kal} kkal` : ''})</span></h2>
        ${r.length ? `<ul class="senarai">${r.map(h => `<li>
          <div><p class="nama">${esc(h.Nama_Sajian)}</p><p class="meta"><span>${h.Anggaran_Kalori} kkal</span><span>${rm(h.Harga_RM)}</span>${h.Status_Pengesahan !== 'Disahkan' ? chip('Tidak dipapar: ' + (h.Status_Pengesahan || 'tiada')) : ''}</p></div>
          <button class="btn btn-kecil btn-bahaya" data-act="buangHarian" data-id="${h.ID_Menu}" data-v="${esc(h.Sesi_Makan)}">Buang</button></li>`).join('')}</ul>`
        : '<div class="kosong">Tiada sajian.</div>'}`;
    }).join('')}`;
  $('#tHarian').onchange = e => { S.data.tarikhHarian = e.target.value; tukarView('harian'); };
  const f = $('#fHarian');
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)); d.Tarikh = tarikh; S.data.sesiHarian = d.Sesi_Makan;
    e.submitter.disabled = true;
    try { await api('tambahMenuHarian', d); toast('Ditambah ke ' + d.Sesi_Makan.toLowerCase() + '.'); tukarView('harian'); }
    catch (err) { toast(err.message, true); e.submitter.disabled = false; }
  };
}

/* ================= PENGURUSAN PENGGUNA ================= */
async function vPengguna() {
  S.data.pengguna = await api('senaraiPengguna');
  lukisPengguna();
}
function lukisPengguna() {
  const semua = S.data.pengguna, tapis = S.data.tapisPengguna || 'Menunggu';
  const kira = s => s === 'Semua' ? semua.length : semua.filter(u => u.Status_Berkesan === s).length;
  $('#main').innerHTML = `
    <section class="kepala"><p>Pendaftaran dan akaun kakitangan</p><h1>Pengguna</h1></section>

/* ================= CETAKAN: LABEL & LAPORAN ================= */
const FORMAT_LABEL = {
  a4_8:   { nama: 'A4, 8 label (99.1 × 67.7 mm), cth. Avery L7165', lajur: 2, baris: 4, w: 99.1, h: 67.7, atas: 13.1, kiri: 4.65, px: 101.6, py: 67.7, saiz: 'besar' },
  a4_10:  { nama: 'A4, 10 label (99.1 × 57 mm), cth. Avery L7173',  lajur: 2, baris: 5, w: 99.1, h: 57,   atas: 6,    kiri: 4.65, px: 101.6, py: 57,   saiz: 'besar' },
  a4_14:  { nama: 'A4, 14 label (99.1 × 38.1 mm), cth. Avery L7163', lajur: 2, baris: 7, w: 99.1, h: 38.1, atas: 15.15, kiri: 4.65, px: 101.6, py: 38.1, saiz: 'kecil' },
  termal: { nama: 'Pencetak label termal, 100 × 50 mm (gulung)', termal: true, w: 100, h: 50, saiz: 'sederhana' }
};
const tetapanLabel = () => Object.assign({ format: 'a4_8', mod: 'pesanan', mula: 1, laraskanX: 0, laraskanY: 0 }, simpan.get('hkl_tetapan_label') || {});
const fmtTel = t => { t = String(t || '').replace(/\D/g, ''); return t.length >= 10 ? t.slice(0, 3) + '-' + t.slice(3, t.length - 4) + ' ' + t.slice(-4) : t; };
const fmtMasa = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})\s*(\d{2}:\d{2})?/); return m ? `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] : ''}` : String(s || ''); };
const pecahItem = s => String(s || '').split('; ').filter(Boolean).map(x => { const m = x.match(/^(.*) x(\d+)$/); return m ? { nama: m[1], q: Number(m[2]) } : { nama: x, q: 1 }; });

function cetak(html, cssHalaman, kelas) {
  let g = $('#gayaHalaman');
  if (!g) { g = document.createElement('style'); g.id = 'gayaHalaman'; document.head.appendChild(g); }
  g.textContent = '@media print{' + cssHalaman + '}';
  const k = $('#kawasanCetak'); k.className = kelas; k.innerHTML = html;
  tutupDialog();
  setTimeout(() => window.print(), 80);
}

// Satu label = satu bekas. Mod 'hidangan' pecahkan pesanan kepada satu label bagi setiap hidangan.
function senaraiLabel(pesanan, mod) {
  const out = [];
  pesanan.forEach(p => {
    const item = pecahItem(p.Item_Dipesan);
    if (mod !== 'hidangan') { out.push({ p, item, ke: 0, drp: 0 }); return; }
    const satu = []; item.forEach(i => { for (let n = 0; n < i.q; n++) satu.push({ nama: i.nama, q: 1 }); });
    satu.forEach((i, n) => out.push({ p, item: [i], ke: n + 1, drp: satu.length }));
  });
  return out;
}
function htmlSatuLabel(l, saiz) {
  const p = l.p;
  return `<div class="lbl lbl-${saiz}">
    <div class="lbl-atas"><span class="lbl-sesi">${esc(p.Sesi_Makan || '')}</span><span class="lbl-no">${esc(p.ID_Pesanan)}</span></div>
    <div class="lbl-nama">${esc(p.Nama_Staf || p.ID_Staf)}</div>
    <div class="lbl-info"><span><b>Wad:</b> ${esc(p.Lokasi_Wad)}</span><span><b>Tel:</b> ${esc(fmtTel(p.No_Tel) || '-')}</span></div>
    <div class="lbl-menu">${l.item.map(i => `<span>${esc(i.nama)}${i.q > 1 ? ` <b>×${i.q}</b>` : ''}</span>`).join('')}</div>
    <div class="lbl-kaki"><span>Tempah: ${esc(fmtMasa(p.Tarikh_Masa))}</span>
      <span>${l.drp > 1 ? `Bekas ${l.ke}/${l.drp} · ` : ''}${p.Jenis_Bayaran === 'Catuan' ? '<b>Catuan</b>' : 'Berbayar ' + rm(p.Jumlah_RM)}</span></div>
  </div>`;
}
function cetakLabel(pesanan, t) {
  if (!pesanan.length) return toast('Tiada pesanan untuk dicetak.', true);
  const f = FORMAT_LABEL[t.format] || FORMAT_LABEL.a4_8;
  const labels = senaraiLabel(pesanan, t.mod);
  const dx = Number(t.laraskanX) || 0, dy = Number(t.laraskanY) || 0;
  let html = '';
  if (f.termal) {
    html = labels.map(l => `<div class="helaian" style="width:${f.w}mm;height:${f.h}mm"><div class="kotak" style="left:${2 + dx}mm;top:${2 + dy}mm;width:${f.w - 4}mm;height:${f.h - 4}mm">${htmlSatuLabel(l, f.saiz)}</div></div>`).join('');
    cetak(html, `@page{size:${f.w}mm ${f.h}mm;margin:0}`, 'cetak-label');
  } else {
    const sehelai = f.lajur * f.baris, langkau = Math.min(Math.max((Number(t.mula) || 1) - 1, 0), sehelai - 1);
    const slot = Array(langkau).fill(null).concat(labels);
    for (let s = 0; s < slot.length; s += sehelai) {
      html += `<div class="helaian" style="width:210mm;height:297mm">` + slot.slice(s, s + sehelai).map((l, i) => {
        if (!l) return '';
        const c = i % f.lajur, r = Math.floor(i / f.lajur);
        return `<div class="kotak" style="left:${f.kiri + c * f.px + dx}mm;top:${f.atas + r * f.py + dy}mm;width:${f.w}mm;height:${f.h}mm">${htmlSatuLabel(l, f.saiz)}</div>`;
      }).join('') + `</div>`;
    }
    cetak(html, '@page{size:A4 portrait;margin:0}', 'cetak-label');
  }
  toast(`${labels.length} label dihantar ke pencetak.`);
}
function bukaDialogLabel(satuPesanan) {
  const t = tetapanLabel(), semua = S.data.dapur || [];
  const bil = (sesi, st) => semua.filter(p => p.Status_Siap !== 'Dibatalkan' && (sesi === 'Semua' || p.Sesi_Makan === sesi) && (st === 'Semua' || ['Baru', 'Disediakan'].includes(p.Status_Siap))).length;
  bukaDialog(satuPesanan ? 'Cetak label ' + satuPesanan.ID_Pesanan : 'Cetak label bekas makanan', `
    <form id="fLabel" class="borang">
      ${satuPesanan ? '' : `<div class="baris2">
        <label class="medan">Sesi<select name="sesi">${opsyen(['Semua'].concat(SESI), sesiSemasa())}</select></label>
        <label class="medan">Pesanan<select name="status"><option value="Aktif">Baru & disediakan</option><option value="Semua">Semua (kecuali batal)</option></select></label>
      </div>`}
      <label class="medan">Kertas stiker<select name="format">${Object.entries(FORMAT_LABEL).map(([k, v]) => `<option value="${k}" ${k === t.format ? 'selected' : ''}>${v.nama}</option>`).join('')}</select></label>
      <div class="pilihan">
        <label><input type="radio" name="mod" value="pesanan" ${t.mod !== 'hidangan' ? 'checked' : ''}><span><b>1 label setiap pesanan</b><small>Semua menu dalam satu bekas.</small></span></label>
        <label><input type="radio" name="mod" value="hidangan" ${t.mod === 'hidangan' ? 'checked' : ''}><span><b>1 label setiap hidangan</b><small>Cth. nasi dan air berasingan: 2 label, ditanda Bekas 1/2, 2/2.</small></span></label>
      </div>
      <div class="baris2" id="medanA4">
        <label class="medan">Mula pada label ke-<input name="mula" type="number" min="1" max="14" value="1" inputmode="numeric">
          <span class="bantuan">Untuk helaian yang sudah separuh digunakan.</span></label>
        <label class="medan">Laras kedudukan (mm)<span style="display:flex;gap:6px"><input name="laraskanX" type="number" step="0.5" value="${t.laraskanX}" title="Kanan (+) / kiri (−)"><input name="laraskanY" type="number" step="0.5" value="${t.laraskanY}" title="Bawah (+) / atas (−)"></span>
          <span class="bantuan">Mendatar, menegak. Jika cetakan tersasar.</span></label>
      </div>
      <p class="kecil" id="bilLabel"></p>
      <button class="btn btn-penuh" type="submit">Cetak</button>
      <p class="bantuan">Dalam tetingkap cetak: pilih skala <b>100% / Actual size</b>, margin <b>None</b>, dan matikan "Headers and footers".</p>
    </form>`);
  const f = $('#fLabel');
  const pilihan = () => {
    const d = Object.fromEntries(new FormData(f));
    const senarai = satuPesanan ? [satuPesanan] : semua.filter(p => p.Status_Siap !== 'Dibatalkan' && (d.sesi === 'Semua' || p.Sesi_Makan === d.sesi) && (d.status === 'Semua' || ['Baru', 'Disediakan'].includes(p.Status_Siap)));
    return { d, senarai };
  };
  const kemas = () => {
    const { d, senarai } = pilihan();
    $('#medanA4').style.display = FORMAT_LABEL[d.format].termal ? 'none' : '';
    const n = senaraiLabel(senarai, d.mod).length, fm = FORMAT_LABEL[d.format];
    const helai = fm.termal ? '' : `, ${Math.ceil((n + Number(d.mula || 1) - 1) / (fm.lajur * fm.baris))} helaian`;
    $('#bilLabel').textContent = `${senarai.length} pesanan → ${n} label${n ? helai : ''}.`;
  };
  f.oninput = kemas; kemas();
  f.onsubmit = e => {
    e.preventDefault();
    const { d, senarai } = pilihan();
    simpan.set('hkl_tetapan_label', { format: d.format, mod: d.mod, laraskanX: d.laraskanX, laraskanY: d.laraskanY });
    cetakLabel(senarai, d);
  };
}

      db.Menu_Harian.push({ Tarikh: d.Tarikh, ID_Menu: d.ID_Menu, Sesi_Makan: d.Sesi_Makan, Anggaran_Kalori: k, Disahkan_Oleh: u.Nama }); return true;
    },
    buangMenuHarian(d) { db.Menu_Harian = db.Menu_Harian.filter(h => !(h.Tarikh === d.Tarikh && h.ID_Menu === d.ID_Menu && h.Sesi_Makan === d.Sesi_Makan)); return true; },
    daftar(d) {
      const id = String(d.ID_Staf || '').trim().toUpperCase(), emel = String(d.Emel || '').trim().toLowerCase();
      if (!/^[A-Z0-9\/-]{3,20}$/.test(id)) ralat('ID staf mesti 3–20 aksara (huruf, nombor, - atau /).');
      syaratKL(d.kataLaluan);
      if (cari(id)) ralat('ID staf ini sudah berdaftar. Guna "Lupa kata laluan" jika tidak ingat.');
      if (db.Pengguna.some(u => u.Emel === emel)) ralat('Emel ini sudah digunakan oleh akaun lain.');
      const u = { ID_Staf: id, Nama: d.Nama.trim(), Peranan: 'STAF', Kata_Laluan: String(d.kataLaluan), Lokasi_Wad: d.Lokasi_Wad.trim(), Jawatan: d.Jawatan,
        No_Tel: d.No_Tel.replace(/[\s-]/g, ''), Emel: emel, Emel_Disahkan: '', Status_Akaun: 'Menunggu', Tarikh_Daftar: masa(), Tarikh_Tamat: d.Tarikh_Tamat || '', Diluluskan_Oleh: '' };
      db.Pengguna.push(u);
      return { status: 'Menunggu', perluKod: true, emel: sorok(emel), autoLulus: true, kodDemo: buatOtp(u, 'daftar') };
    },
    sahkanEmel(d) {
      const u = cari(d.ID_Staf) || ralat('ID staf tidak dijumpai.');
      if (u.Emel_Disahkan === 'YA') return { status: statusB(u) };
      semakOtp(u.ID_Staf, 'daftar', d.kod);
      u.Emel_Disahkan = 'YA';
      if (u.Status_Akaun === 'Menunggu') { u.Status_Akaun = 'Aktif'; u.Diluluskan_Oleh = 'auto (emel disahkan)'; }
      return { status: u.Status_Akaun };
    },
    hantarKod(d) {
      const u = cari(d.ID_Staf), umum = { mesej: 'Jika ID staf dan emel sepadan dengan akaun berdaftar, kod telah dihantar ke emel tersebut.' };
      if (d.tujuan === 'daftar') {
        if (!u || u.Emel_Disahkan === 'YA') return umum;
        return { mesej: 'Kod baharu dihantar ke ' + sorok(u.Emel) + '.', kodDemo: buatOtp(u, 'daftar') };
      }
      if (!u || u.Emel !== String(d.Emel || '').trim().toLowerCase() || ['Ditolak', 'Digantung'].includes(statusB(u))) return umum;
      return { ...umum, kodDemo: buatOtp(u, 'reset') };
    },
    resetKataLaluan(d) {
      const u = cari(d.ID_Staf) || ralat('Kod tamat tempoh atau tidak wujud. Minta kod baharu.');
      syaratKL(d.kataLaluanBaru); semakOtp(u.ID_Staf, 'reset', d.kod);
      u.Kata_Laluan = String(d.kataLaluanBaru); u.Emel_Disahkan = 'YA';
      if (u.Status_Akaun === 'Menunggu') { u.Status_Akaun = 'Aktif'; u.Diluluskan_Oleh = 'auto (emel disahkan)'; }
      return true;
    },
    tukarKataLaluan(d, user) {
      const u = cari(user.ID_Staf);
      if (u.Kata_Laluan !== String(d.kataLaluanLama)) ralat('Kata laluan semasa salah.');
      syaratKL(d.kataLaluanBaru); u.Kata_Laluan = String(d.kataLaluanBaru);
      return F.login({ id: u.ID_Staf, kataLaluan: u.Kata_Laluan });
    },
    senaraiPengguna: () => db.Pengguna.map(u => { const o = { ...u, Status_Berkesan: statusB(u) }; delete o.Kata_Laluan; return o; }),
    kemaskiniPengguna(d, user) {
      const u = sasaran(d.ID_Staf, user);
      if (d.Status_Akaun) { if (d.Status_Akaun === 'Aktif' && u.Status_Akaun !== 'Aktif') u.Diluluskan_Oleh = user.Nama; u.Status_Akaun = d.Status_Akaun; }
      if (d.Tarikh_Tamat !== undefined) u.Tarikh_Tamat = d.Tarikh_Tamat;
      if (d.Lokasi_Wad) u.Lokasi_Wad = d.Lokasi_Wad.trim();
      if (d.Peranan && d.Peranan !== u.Peranan) { if (user.Peranan !== 'ADMIN') ralat('Hanya ADMIN boleh menukar peranan.'); u.Peranan = d.Peranan; }
      return true;
    },
    janaKataLaluan(d, user) { const u = sasaran(d.ID_Staf, user); u.Kata_Laluan = 'Hkl' + rawak(3).toLowerCase() + String(Math.floor(100 + Math.random() * 900)); return { ID_Staf: u.ID_Staf, Nama: u.Nama, kataLaluanSementara: u.Kata_Laluan }; },
    senaraiStaf: () => db.Pengguna.filter(u => u.Peranan === 'STAF' && statusB(u) === 'Aktif').map(u => ({ ID_Staf: u.ID_Staf, Nama: u.Nama, Lokasi_Wad: u.Lokasi_Wad })),
    catuan: d => db.Senarai_Catuan.filter(c => c.Tarikh === d.tarikh),
    tambahCatuan(d) {
      const ids = [...new Set(String(d.ID_Staf).split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean))];
      const ditambah = [], dilangkau = [];
      ids.forEach(id => {
        const s = db.Pengguna.find(u => u.Peranan === 'STAF' && u.ID_Staf === id && statusB(u) === 'Aktif');
        const dup = db.Senarai_Catuan.some(c => c.Tarikh === d.Tarikh && c.ID_Staf === id && c.Sesi_Catuan === d.Sesi_Catuan);
        if (!s || dup) return dilangkau.push(id + (s ? ' (sudah ada)' : ' (tiada dalam senarai staf)'));
        db.Senarai_Catuan.push({ Tarikh: d.Tarikh, ID_Staf: id, Nama_Staf: s.Nama, Sesi_Catuan: d.Sesi_Catuan, Status_Tuntut: 'Belum' }); ditambah.push(id);
      });
      return { ditambah, dilangkau };
    },
    buangCatuan(d) {
      const c = db.Senarai_Catuan.find(x => x.Tarikh === d.Tarikh && x.ID_Staf === d.ID_Staf && x.Sesi_Catuan === d.Sesi_Catuan) || ralat('Rekod tidak dijumpai.');
      if (c.Status_Tuntut === 'Dituntut') ralat('Catuan sudah dituntut, tidak boleh dibuang.');
      db.Senarai_Catuan.splice(db.Senarai_Catuan.indexOf(c), 1); return true;
    },
    buatPesanan(d, u) {
      const t = hariIni(), jenis = d.Jenis_Bayaran === 'Catuan' ? 'Catuan' : 'Berbayar';
      if (!String(d.Lokasi_Wad || '').trim()) ralat('Isi lokasi atau wad penghantaran.');
      const ada = Object.fromEntries(F.menuHariIni({ tarikh: t }, u).menu.filter(m => m.Sesi_Makan === d.sesi).map(m => [m.ID_Menu, m]));
      let jumlah = 0, bil = 0;
      const baris = d.items.map(it => { const m = ada[it.ID_Menu] || ralat('Ada item yang tiada lagi dalam menu. Muat semula menu.'); jumlah += m.Harga_RM * it.qty; bil += it.qty; return m.Nama_Sajian + ' x' + it.qty; });
      if (jenis === 'Catuan') {
        if (bil > CATUAN_MAX_HIDANGAN) ralat('Catuan meliputi ' + CATUAN_MAX_HIDANGAN + ' hidangan sahaja.');
        const c = db.Senarai_Catuan.find(x => x.Tarikh === t && x.ID_Staf === u.ID_Staf && x.Sesi_Catuan === d.sesi && x.Status_Tuntut !== 'Dituntut') || ralat('Tiada catuan aktif untuk sesi ini.');
        c.Status_Tuntut = 'Dituntut'; jumlah = 0;
      }
      const p = { ID_Pesanan: 'P' + t.slice(2).replace(/-/g, '') + '-' + rawak(4), Tarikh_Masa: masa(), ID_Staf: u.ID_Staf, Lokasi_Wad: d.Lokasi_Wad.trim(),
        Item_Dipesan: baris.join('; '), Jumlah_RM: Math.round(jumlah * 100) / 100, Jenis_Bayaran: jenis, Status_Siap: 'Baru', Sesi_Makan: d.sesi, Nama_Staf: u.Nama };
      db.Pesanan_Masuk.push(p); return p;
    },
    pesananSaya: (d, u) => db.Pesanan_Masuk.filter(p => p.ID_Staf === u.ID_Staf).slice().reverse().slice(0, 30),
    pesananMasuk: d => denganTel(db.Pesanan_Masuk.filter(p => p.Tarikh_Masa.startsWith(d.tarikh || hariIni()))),
    laporanPesanan(d) {
      if (d.hingga < d.dari) ralat('Tarikh akhir mesti selepas tarikh mula.');
      return denganTel(db.Pesanan_Masuk.filter(p => { const t = p.Tarikh_Masa.slice(0, 10); return t >= d.dari && t <= d.hingga && (d.sesi === 'Semua' || p.Sesi_Makan === d.sesi); }));
    },
    kemaskiniPesanan(d) { const p = db.Pesanan_Masuk.find(x => x.ID_Pesanan === d.ID_Pesanan) || ralat('Pesanan tidak dijumpai.'); p.Status_Siap = d.Status_Siap; return p; }
  };
  const PERANAN_DIBENAR = {
    daftarMenu: ['PENGUSAHA', 'DIETETIK'], simpanMenu: ['PENGUSAHA'], sahkanMenu: ['DIETETIK'], menuHarian: ['DIETETIK'], tambahMenuHarian: ['DIETETIK'],
    buangMenuHarian: ['DIETETIK'], senaraiStaf: ['DIETETIK'], catuan: ['DIETETIK'], tambahCatuan: ['DIETETIK'], buangCatuan: ['DIETETIK'],
    senaraiPengguna: PELULUS, kemaskiniPengguna: PELULUS, janaKataLaluan: PELULUS,
    buatPesanan: ['STAF'], pesananSaya: ['STAF'], pesananMasuk: ['PENGUSAHA'], kemaskiniPesanan: ['PENGUSAHA'], laporanPesanan: ['DIETETIK', 'ADMIN']
  };

  if (!db) seed();
  segarHari();
  return {
    users: () => db.Pengguna.filter(u => statusB(u) === 'Aktif' && /^[APDS]\d{3}$/.test(u.ID_Staf)),
    handle({ action, token, data }) {
      try {
        segarHari();
        if (!F[action]) ralat('Tindakan tidak dikenali: ' + action);
        let u = null;
        if (!['login', 'daftar', 'sahkanEmel', 'hantarKod', 'resetKataLaluan'].includes(action)) {
          u = sesiToken[token] || simpan.get('hkl_demo_tok_' + token);
          if (!u) return { ok: false, error: 'SESI_TAMAT' };
          if (PERANAN_DIBENAR[action] && !PERANAN_DIBENAR[action].includes(u.Peranan)) ralat('Peranan anda tidak dibenarkan untuk tindakan ini.');
        }
        const out = F[action](data || {}, u); save();
        return { ok: true, data: JSON.parse(JSON.stringify(out)) };
      } catch (e) { return { ok: false, error: e.message }; }
    }
  };
})();

/* ================= MULA ================= */
(function mula() {
  const s = simpan.get('hkl_sesi');
  if (s && s.token && s.user) { S.token = s.token; S.user = s.user; mulaApp(); }
  else paparLogin();
  if (!DALAM_GAS && 'serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
